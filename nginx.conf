# ==========================================================
#  GUSTAVOEURO — Nginx hardening + reverse proxy opzionale
#  Metti in /etc/nginx/sites-available/gustavoeuro e linka
# ==========================================================

server {
    listen 80;
    listen [::]:80;
    server_name gustavoeuro.com www.gustavoeuro.com;
    return 301 https://gustavoeuro.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gustavoeuro.com;
    return 301 https://gustavoeuro.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gustavoeuro.com;

    root /var/www/gustavoeuro;
    index index.html;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/gustavoeuro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gustavoeuro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Header sicurezza ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://i.ibb.co https://api.qrserver.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net; frame-ancestors 'self'; upgrade-insecure-requests" always;
    server_tokens off;

    # ---- Gzip ----
    gzip on;
    gzip_types text/html text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Cache asset ----
    location ~* \.(png|jpg|jpeg|gif|webp|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # ---- security.txt ----
    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- Blocca file nascosti e sorgenti ----
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(md|conf|toml)$ {
        allow all;
    }

    # ---- Error pages ----
    error_page 404 /404.html;
    error_page 403 /404.html;

    # ---- Rate limiting (vedi firewall.conf) ----
    limit_req zone=geburst burst=30 nodelay;
    limit_conn geconn 20;
}
