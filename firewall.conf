# ==========================================================
#  GUSTAVOEURO — firewall.conf
#  Includi dentro il blocco http{} di nginx.conf:
#     include /etc/nginx/conf.d/firewall.conf;
#  E lancia lo script ipset a parte (sotto).
# ==========================================================

# ---- Rate limit globale ----
limit_req_zone $binary_remote_addr zone=geburst:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gelogin:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=geconn:10m;

# ---- Blocca scanner noti per User-Agent (mappa) ----
map $http_user_agent $is_bad_bot {
    default 0;
    ~*nikto        1;
    ~*sqlmap       1;
    ~*nmap         1;
    ~*masscan      1;
    ~*wpscan       1;
    ~*zgrab        1;
    ~*Go-http-client 1;
    ~*python-requests 1;
}

# ---- Blocca metodi strani ----
map $request_method $bad_method {
    default 0;
    GET    0;
    HEAD   0;
    POST   0;
    OPTIONS 0;
    PUT    1;
    DELETE 1;
    TRACE  1;
}

server {
    # blocca metodi inutili
    if ($bad_method) { return 405; }

    # blocca bot scanner
    if ($is_bad_bot) { return 403; }

    # rate limit stretto su pagine sensibili
    location ~* ^/(checkout|pay|track) {
        limit_req zone=gelogin burst=10 nodelay;
    }
}
